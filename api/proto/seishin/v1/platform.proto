// The Canonical Platform API — the hourglass waist. This is the only
// vocabulary core services accept; see docs/architecture.md section 2.
//
// Placeholder for CORE-001: full Identity/Directory/Session/Policy/
// MediaControl service definitions land there. Kept minimal here so the
// module has something real to lint and generate against from the start.
syntax = "proto3";

package seishin.v1;

option go_package = "github.com/seishinapp/seishin/api/proto/seishin/v1;seishinv1";

// PlatformInfo is a placeholder RPC proving the protobuf -> gRPC -> REST
// generation pipeline (design.md D2) end to end before real services exist.
service PlatformService {
  rpc GetPlatformInfo(GetPlatformInfoRequest) returns (GetPlatformInfoResponse);
}

message GetPlatformInfoRequest {}

message GetPlatformInfoResponse {
  string api_version = 1;
}
